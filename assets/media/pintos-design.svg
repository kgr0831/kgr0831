<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-label="PintOS / Finding the flaw in my own design"><rect width="1080" height="300" fill="#111827"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="41" font-size="25" font-weight="700" fill="#f3f4f6">PintOS / Finding the flaw in my own design</text><text x="36" y="69" font-size="16" fill="#a7b2c4">Priority donation: from a simplification attempt to tracking the required state</text><svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#89b8fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" x="36" y="108"><circle cx="10" cy="10" r="6" /><path d="m15 15 6 6" /></svg><text x="78" y="130" font-size="21" font-weight="700" fill="#f3f4f6">Hypothesis</text><text x="36" y="167" font-size="18" fill="#a7b2c4">Replace donation lists</text><text x="36" y="190" font-size="18" fill="#a7b2c4">with one Release-Trigger</text><path d="M45 201v21m-5-5 5 5 5-5" stroke="#89b8fb" stroke-width="2" fill="none"/><text x="36" y="247" font-size="18" fill="#f3f4f6">Implement and test the idea</text><path d="M366 104V267" stroke="#354154"/><svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#89b8fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" x="388" y="108"><circle cx="6" cy="5" r="2" /><circle cx="6" cy="19" r="2" /><circle cx="18" cy="6" r="2" /><path d="M6 7v10M18 8c0 7-12 3-12 9" /></svg><text x="430" y="130" font-size="21" font-weight="700" fill="#f3f4f6">Counterexample</text><text x="388" y="167" font-size="18" fill="#a7b2c4">Multiple and nested donation</text><text x="388" y="190" font-size="18" fill="#a7b2c4">lose dependency information</text><path d="M397 201v21m-5-5 5 5 5-5" stroke="#89b8fb" stroke-width="2" fill="none"/><text x="388" y="247" font-size="18" fill="#f3f4f6">Find the missing state</text><path d="M718 104V267" stroke="#354154"/><svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#89b8fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" x="740" y="108"><circle cx="12" cy="12" r="9" /><path d="m7 12 3 3 7-7" /></svg><text x="782" y="130" font-size="21" font-weight="700" fill="#f3f4f6">Redesign</text><text x="740" y="167" font-size="18" fill="#a7b2c4">Track donations per lock</text><path d="M749 201v21m-5-5 5 5 5-5" stroke="#89b8fb" stroke-width="2" fill="none"/><text x="740" y="247" font-size="18" fill="#f3f4f6">Recompute on release</text><text x="740" y="270" font-size="18" fill="#f3f4f6">Pass the related tests</text></g></svg>